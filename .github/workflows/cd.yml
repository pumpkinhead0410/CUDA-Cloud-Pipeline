name: CD – Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [staging, production]

env:
  AWS_REGION:       us-east-1
  ECR_REPOSITORY:   cuda-pipeline-production/inference-api
  EKS_CLUSTER_NAME: cuda-pipeline-production
  K8S_NAMESPACE:    mlops
  IMAGE_NAME:       cuda-cloud-pipeline

permissions:
  id-token: write    # OIDC token for AWS auth
  contents: read

jobs:
  # ── Build & push Docker image ───────────────────────────────────────────
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      docker/Dockerfile
          push:      true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Export image URI
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "image-uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  # ── Deploy to EKS ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name   "$EKS_CLUSTER_NAME"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/configmap.yaml

      - name: Update deployment image
        run: |
          IMAGE_URI="${{ needs.build-push.outputs.image-uri }}"
          # Replace the placeholder registry in deployment.yaml
          sed "s|REGISTRY_PLACEHOLDER/cuda-cloud-pipeline:latest|${IMAGE_URI}|g" \
            kubernetes/deployment.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/inference-api \
            --namespace "$K8S_NAMESPACE" \
            --timeout=300s

      - name: Smoke test
        run: |
          # Get the load-balancer external hostname
          LB_HOSTNAME=$(kubectl get svc inference-api \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo "Testing http://${LB_HOSTNAME}/healthz …"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${LB_HOSTNAME}/healthz" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt ${i})."
              exit 0
            fi
            echo "Attempt ${i}: status ${STATUS} – retrying in 15 s…"
            sleep 15
          done
          echo "Smoke test failed after 10 attempts."
          exit 1

  # ── Terraform apply (infrastructure changes) ────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=cuda-cloud-pipeline/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -out=tfplan -var="ecr_image_tag=${{ github.sha }}"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
