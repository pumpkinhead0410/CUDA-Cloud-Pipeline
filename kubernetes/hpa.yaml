# HorizontalPodAutoscaler – scale based on CPU AND custom GPU-utilisation metric
#
# Prerequisites
# -------------
# - metrics-server installed in the cluster   (for CPU/memory)
# - Prometheus Adapter configured             (for custom metrics)
#
# Custom metric
#   Exposed by the inference API at /metrics as:
#     inference_queue_depth{namespace="mlops",service="inference-api"}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-api-hpa
  namespace: mlops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api

  minReplicas: 2
  maxReplicas: 10

  metrics:
    # ── CPU utilisation ─────────────────────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type:               AverageUtilization
          averageUtilization: 70

    # ── Memory utilisation ──────────────────────────────────────────────
    - type: Resource
      resource:
        name: memory
        target:
          type:               AverageUtilization
          averageUtilization: 80

    # ── Custom: inference request queue depth ───────────────────────────
    - type: Pods
      pods:
        metric:
          name: inference_queue_depth
        target:
          type:         AverageValue
          averageValue: "10"

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type:          Pods
          value:         2           # add at most 2 pods per 60 s
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # 5-minute cool-down before scale-in
      policies:
        - type:          Pods
          value:         1           # remove at most 1 pod per 120 s
          periodSeconds: 120
